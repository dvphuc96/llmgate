openapi: 3.1.0
info:
  title: llmgate API
  version: 1.0.0
  description: OpenAI-compatible AI gateway plus admin API. Proxy endpoints follow the OpenAI Chat Completions schema; only gateway-specific parts are detailed here.
servers:
  - url: http://localhost:8000
security:
  - virtualKey: []
paths:
  /v1/chat/completions:
    post:
      summary: Chat completion (OpenAI-compatible, stream or not)
      operationId: chatCompletions
      parameters:
        - name: X-LLMGate-Cache
          in: header
          schema: { type: string, enum: [allow, deny] }
        - name: Cache-Control
          in: header
          schema: { type: string, example: no-store }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChatRequest' }
            example:
              model: smart
              messages:
                - { role: system, content: "Bạn là trợ lý CSKH." }
                - { role: user, content: "Làm sao để đổi mật khẩu?" }
              temperature: 0
      responses:
        '200':
          description: Completion (application/json) or SSE stream (text/event-stream)
          headers:
            X-LLMGate-Request-Id: { schema: { type: string } }
            X-LLMGate-Provider: { schema: { type: string, example: "anthropic:<model-id>" } }
            X-LLMGate-Cache: { schema: { type: string, example: "semantic; similarity=0.973" } }
            X-LLMGate-Cost-USD: { schema: { type: string, example: "0.000412" } }
            X-LLMGate-Budget-Warning: { schema: { type: string, example: "monthly 83%" } }
          content:
            application/json:
              schema: { type: object, description: OpenAI ChatCompletion object }
            text/event-stream:
              schema: { type: string, description: "data: {chunk}\\n\\n … data: [DONE]" }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '402': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
        '504': { $ref: '#/components/responses/Error' }
  /v1/embeddings:
    post:
      summary: Embeddings (OpenAI-compatible)
      operationId: embeddings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, input]
              properties:
                model: { type: string, example: embed }
                input: { oneOf: [{ type: string }, { type: array, items: { type: string } }] }
      responses:
        '200': { description: OpenAI embedding list object }
  /v1/models:
    get:
      summary: Aliases this key may use
      responses:
        '200':
          description: OpenAI model list object
  /admin/tenants:
    post:
      summary: Create tenant
      security: [{ admin: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TenantInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tenant' }
  /admin/tenants/{id}:
    patch:
      summary: Update limits, budget, cache settings
      security: [{ admin: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TenantInput' }
      responses: { '200': { description: Updated } }
  /admin/tenants/{id}/keys:
    post:
      summary: Create a virtual key (plaintext shown once)
      security: [{ admin: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                allowed_aliases: { type: array, items: { type: string } }
                rpm_limit: { type: integer }
      responses:
        '201':
          description: Key created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  key: { type: string, example: "lg-3f9a…" }
                  prefix: { type: string }
  /admin/keys/{key_id}:
    delete:
      summary: Revoke key (effective within 30 s)
      security: [{ admin: [] }]
      parameters: [{ name: key_id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '204': { description: Revoked } }
  /admin/tenants/{id}/cache:
    delete:
      summary: Purge exact and semantic cache of a tenant
      security: [{ admin: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '202': { description: Purge started } }
  /admin/usage:
    get:
      summary: Aggregated usage and cost
      security: [{ admin: [] }]
      parameters:
        - { name: tenant_id, in: query, schema: { type: string, format: uuid } }
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - { name: group_by, in: query, schema: { type: string, enum: [day, model, provider, key, cache], default: day } }
      responses:
        '200':
          description: Rows
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    bucket: { type: string }
                    requests: { type: integer }
                    input_tokens: { type: integer }
                    output_tokens: { type: integer }
                    cost_usd: { type: number }
                    saved_usd: { type: number }
                    cache_hit_rate: { type: number }
  /healthz: { get: { security: [], responses: { '200': { description: OK } } } }
  /readyz: { get: { security: [], responses: { '200': { description: Ready; body reports provider breaker states } } } }
components:
  securitySchemes:
    virtualKey: { type: http, scheme: bearer, description: "Virtual key lg-…" }
    admin: { type: http, scheme: bearer, description: Admin token }
  responses:
    Error:
      description: OpenAI-style error
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  type: { type: string }
                  code: { type: string, enum: [invalid_request, invalid_api_key, model_not_allowed, budget_exceeded, rate_limit_exceeded, upstream_error, upstream_timeout] }
                  message: { type: string }
                  param: { type: string }
  schemas:
    ChatRequest:
      type: object
      required: [model, messages]
      properties:
        model: { type: string, description: "alias (smart, fast) or provider:model" }
        messages:
          type: array
          items:
            type: object
            required: [role, content]
            properties:
              role: { type: string, enum: [system, user, assistant, tool] }
              content: { type: string }
        temperature: { type: number }
        max_tokens: { type: integer }
        stream: { type: boolean }
        stream_options: { type: object }
        tools: { type: array, items: { type: object } }
        seed: { type: integer }
        response_format: { type: object }
      additionalProperties: true
    TenantInput:
      type: object
      properties:
        name: { type: string }
        monthly_budget_usd: { type: number }
        daily_budget_usd: { type: number }
        rpm_limit: { type: integer }
        tpm_limit: { type: integer }
        semantic_cache_enabled: { type: boolean }
        semantic_threshold: { type: number, minimum: 0.8, maximum: 0.999 }
    Tenant:
      allOf:
        - $ref: '#/components/schemas/TenantInput'
        - type: object
          properties:
            id: { type: string, format: uuid }
            created_at: { type: string, format: date-time }
